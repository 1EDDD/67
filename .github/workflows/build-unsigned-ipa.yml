name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: 67-main-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Airlift Rust build
        uses: actions/cache@v4
        with:
          path: ~/.cache/67-airlift-target
          key: 67-airlift-${{ runner.os }}-${{ hashFiles('Scripts/airlift-read-file.patch', 'Scripts/build-airlift-xcframework.sh') }}
          restore-keys: |
            67-airlift-${{ runner.os }}-

      - name: Build Airlift FFI
        run: bash Scripts/build-airlift-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          mkdir -p build
          xcodebuild \
            -project ResolutionStudio.xcodeproj \
            -scheme ResolutionStudio \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ResolutionStudio.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify Airlift Grappa symbol
        run: |
          APP_BINARY="build/ResolutionStudio.xcarchive/Products/Applications/ResolutionStudio.app/ResolutionStudio"
          xcrun nm -gU "$APP_BINARY" | grep -q 'ALGetGrappaToken' || {
            echo "::error::ALGetGrappaToken is missing from the Release app binary; AirTraffic sync would fail."
            exit 1
          }

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ResolutionStudio.xcarchive/Products/Applications/ResolutionStudio.app build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload 67-unsigned.ipa
          test -s 67-unsigned.ipa
          unzip -t 67-unsigned.ipa

      - name: Publish direct IPA download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/67-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "67 build ${{ github.run_number }}" \
            --notes "Unsigned iOS IPA. Download 67-unsigned.ipa directly from Assets."
